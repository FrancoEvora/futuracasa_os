name: Futura Casa release verification
on:
  push:
    paths:
      - '.github/workflows/fcp-release-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated public portal
        run: node build-portal.mjs
      - name: Verify live public services with synthetic data
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyPortal} from './verify-portal.mjs';
          const report=await verifyPortal();
          fs.writeFileSync('qa-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          NODE
      - name: Save review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futura-casa-release-review
          path: |
            dist/
            qa-report.json
          retention-days: 3
