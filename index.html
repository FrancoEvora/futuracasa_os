12px;text-transform:uppercase;letter-spacing:.08em;color:#fff;font-weight:850;font-size:13px}.hero h1{font-size:clamp(42px,6.8vw,84px);line-height:.92;letter-spacing:-.06em;margin:24px 0 18px;text-transform:uppercase}.orange{color:var(--orange)}.hero p{font-size:19px;line-height:1.48;color:rgba(255,255,255,.76);max-width:720px}.btn{border:0;border-radius:18px;min-height:50px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900}.btn.primary{background:var(--orange);color:#fff}.btn.primary:hover{background:var(--orange2)}.btn.secondary{background:transparent;border:1px solid var(--orange);color:var(--orange)}.btn.light{background:var(--cream);color:var(--darkink)}.btn.dark{background:#0d1219;color:#fff;border:1px solid rgba(255,255,255,.14)}.btn.small{min-height:38px;border-radius:14px;font-size:13px}.btn.block{width:100%}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip,.tag{display:inline-flex;align-items:center;width:max-content;max-width:100%;border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:850}.tag.orangeTag{background:#ffe7dc;color:#b84312;border:0}.tag.teal{background:#e2f7f7;color:#177277;border:0}.tag.green{background:#e5f5e8;color:#32633a;border:0}.tag.red{background:#ffe5df;color:#a73825;border:0}.biaCard{background:var(--cream);color:var(--darkink);border-radius:36px;padding:26px;box-shadow:var(--shadow);display:grid;align-content:space-between;gap:18px}.biaTop{display:flex;gap:16px;align-items:center}.avatar{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 24%,#ffd8bb,#b05a31 42%,#2b1410 72%);box-shadow:0 0 0 5px #fff,0 12px 30px rgba(0,0,0,.22);position:relative}.avatar:after{content:"Bia";position:absolute;right:-12px;bottom:4px;font-family:cursive;color:var(--orange);font-size:30px;transform:rotate(-8deg)}.biaCard h2{font-size:34px;letter-spacing:-.05em;margin:0}.biaCard p{color:#59616b;margin:0;line-height:1.45}.board{border-radius:28px;background:#111822;color:#fff;padding:18px;display:grid;gap:12px}.board h3{margin:0;text-transform:uppercase;color:#fff}.bullet{display:flex;gap:12px;align-items:flex-start}.icon{width:42px;height:42px;border-radius:50%;border:2px solid var(--orange);display:grid;place-items:center;color:var(--orange);font-weight:900;flex:0 0 auto}.section{padding:22px 0}.panel{background:var(--cream);color:var(--darkink);border:1px solid rgba(255,255,255,.12);border-radius:34px;box-shadow:var(--shadow);padding:24px}.darkPanel{background:rgba(13,18,25,.92);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:34px;box-shadow:var(--shadow);padding:24px}.panelHead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}.panelHead h2{margin:6px 0 4px;font-size:clamp(28px,4vw,48px);letter-spacing:-.05em}.panelHead p{margin:0;color:#657080;max-width:780px}.darkPanel .panelHead p{color:rgba(255,255,255,.7)}.grid{display:grid;gap:16px}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:repeat(4,1fr)}.mainGrid{grid-template-columns:1.2fr .8fr}.card{background:#fff;border:1px solid #eadfce;border-radius:24px;padding:18px;box-shadow:0 12px 28px rgba(0,0,0,.06)}.darkCard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px}.card h3,.darkCard h3{margin:0 0 8px;letter-spacing:-.03em}.muted{color:#687386}.darkCard .muted{color:rgba(255,255,255,.66)}.big{font-size:32px;font-weight:950;letter-spacing:-.05em}.field{display:grid;gap:7px}.field label{font-weight:850;color:#3b4655;font-size:14px}.darkPanel .field label,.darkCard .field label{color:rgba(255,255,255,.76)}.field input,.field select,.field textarea{width:100%;border:1px solid #dfd1be;background:#fff;color:#141923;border-radius:16px;min-height:48px;padding:0 13px;outline:none}.field textarea{min-height:110px;padding:13px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.btn:focus-visible{outline:3px solid rgba(255,91,17,.28);outline-offset:2px}.formGrid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}.question{display:grid;gap:12px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.option{border:1px solid #dfd1be;background:#fff;border-radius:18px;padding:14px;text-align:left;font-weight:850;color:#253142}.option.active{border-color:var(--orange);background:#fff0e7;color:#9d3b10}.rangeRow{display:grid;gap:8px}.rangeRow input{accent-color:var(--orange)}.meter{height:11px;background:#eadfce;border-radius:999px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ff9c59)}.tableWrap{overflow:auto;border-radius:24px;border:1px solid #eadfce;background:#fff}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #efe5d8;font-size:14px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8c4a26;background:#fff6ef}.table tr:last-child td{border-bottom:0}.status{font-weight:900}.status.disponível,.status.ativo,.status.concluído{color:#2f713e}.status.reservado,.status.média,.status['em andamento']{color:#b35a1b}.status.vendido,.status.inativo{color:#687386}.priorityList{display:grid;gap:10px}.priority{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #eadfce;border-radius:18px;padding:14px}.priority:before{content:'•';width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:950}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #dfd1be;border-radius:999px;background:#fff;color:#546070;min-height:44px;padding:0 16px;font-weight:850}.tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.phase{background:#fff;border:1px solid #eadfce;border-radius:22px;padding:16px;text-align:center}.phase .circle{width:58px;height:58px;border-radius:50%;background:#e8e1d7;margin:0 auto 8px;display:grid;place-items:center;font-weight:950}.phase.done .circle{background:#40713f;color:#fff}.phase.active .circle{background:var(--orange);color:#fff}.footer{padding:32px 0;color:rgba(255,255,255,.55);font-size:13px}.adminBar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.supabase{position:fixed;right:14px;bottom:14px;background:#fff;color:#151a23;border-radius:999px;padding:9px 12px;box-shadow:var(--shadow);font-size:12px;z-index:100}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#161c25;border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);display:none;z-index:120;font-weight:850}.toast.show{display:block}
@media(max-width:980px){.heroGrid,.mainGrid,.cols4,.cols3,.cols2{grid-template-columns:1fr}.topin{align-items:flex-start}.menu{display:grid}.nav{display:none;width:100%;grid-template-columns:1fr 1fr}.nav.open{display:grid}.formGrid{grid-template-columns:1fr}.formGrid>*{grid-column:1!important}.timeline{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}}
@media(max-width:520px){.wrap{width:min(100% - 18px,1220px)}.topin{min-height:72px}.brand .mark{width:48px;height:48px}.word b{font-size:22px}.hero h1{font-size:40px}.panel,.darkPanel,.heroCard,.biaCard{border-radius:26px;padding:18px}.nav{grid-template-columns:1fr}.timeline{grid-template-columns:1fr}.big{font-size:26px}}
</style>

<body>
<header class="top"><div class="wrap topin"><div class="brand"><button class="menu" id="menuBtn">☰</button><div class="mark"></div><div class="word"><b>Futura<br>Casa</b><span>Inteligência imobiliária, marketing e vendas</span></div></div><nav class="nav" id="nav"></nav></div></header>
<main id="app"></main><div class="supabase" id="sbStatus">Conectando Supabase…</div><div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://qsdffayasuzsmngteika.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InFzZGZmYXlhc3V6c21uZ3RlaWthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MTI0MjEsImV4cCI6MjA5OTk4ODQyMX0.TiKP8yY7_miPfrOIZYKj7hpCx-h7EKDqKnsOrSsnk6Y';
const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const state={view:location.hash.replace('#','')||'inicio',q:0,bia:{want:'Terreno urbano',goal:'Investir',city:'Monte Carmelo, Uberlândia e região',budget:600000,down:120000,monthly:4000,pain:'Espaço externo',extra:'Quintal e churrasqueira',timeline:'1 a 2 anos',income:15000,reject:'Sem matrícula clara',priority:'segurança jurídica'},data:{enterprises:[],units:[],leads:[],brokers:[],sdrs:[],works:[],occurrences:[],tasks:[],logs:[]},offline:false};
const seed={enterprises:[{id:'seed-e1',name:'Solaris Residencial Resort',city:'Monte Carmelo',region:'Alto Paranaíba',positioning:'moradia, lazer, natureza e segurança',delivery_year:2028,evidence_level:82,investment_thesis:'Cidade média com expansão urbana e boa relação entre preço, qualidade de vida e documentação.'},{id:'seed-e2',name:'Oportunidade Uberlândia Sul',city:'Uberlândia',region:'Zona Sul',positioning:'liquidez e alta demanda',delivery_year:2029,evidence_level:61,investment_thesis:'Vetor urbano forte, mas exige mais diligência documental.'}],units:[{id:'u1',enterprise_id:'seed-e1',label:'Quadra H · Lote 14',area_m2:456,price:478000,monthly_payment:3300,status:'disponível',ideal_profile:'família',sales_argument:'Segurança, lazer e documentação verificável.',probable_objection:'entrada alta',liquidity:'alta',commercial_priority:'caixa',verification:{matricula:true,cronograma:true,licenciamento:true,garantia:true,historico:true,indexador:true}},{id:'u2',enterprise_id:'seed-e1',label:'Quadra A · Lote 39',area_m2:580,price:592000,monthly_payment:4100,status:'disponível',ideal_profile:'construtor',sales_argument:'Metragem ampla para implantação e revenda.',probable_objection:'parcela alta',liquidity:'alta',commercial_priority:'estratégico',verification:{matricula:true,cronograma:true,licenciamento:true,garantia:false,historico:true,indexador:true}},{id:'u3',enterprise_id:'seed-e2',label:'Apartamento 2Q · Torre Beta',area_m2:72,price:520000,monthly_payment:3900,status:'disponível',ideal_profile:'investidor',sales_argument:'Liquidez urbana e demanda constante.',probable_objection:'metragem',liquidity:'alta',commercial_priority:'normal',verification:{matricula:true,cronograma:false,licenciamento:true,garantia:false,historico:false,indexador:true}}],brokers:[],sdrs:[],works:[],occurrences:[],leads:[],tasks:[],logs:[]};
const api={async list(table){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`,{headers});if(!r.ok)throw new Error(table);return r.json()},async insert(table,row){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers,body:JSON.stringify(row)});if(!r.ok)throw new Error(await r.text());return (await r.json())[0]}};
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Number(v||0));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function cls(s){return String(s||'').toLowerCase().replaceAll(' ','-').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function setView(v){state.view=v;history.replaceState(null,'','#'+v);render()}
async function load(){try{const [enterprises,units,leads,brokers,sdrs,works,occurrences,tasks]=await Promise.all(['fc_enterprises','fc_units','fc_leads','fc_brokers','fc_sdrs','fc_work_schedules','fc_occurrences','fc_tasks'].map(t=>api.list(t)));Object.assign(state.data,{enterprises,units,leads,brokers,sdrs,works,occurrences,tasks});$('#sbStatus').textContent='Supabase conectado';}catch(e){state.offline=true;Object.assign(state.data,JSON.parse(JSON.stringify(seed)));$('#sbStatus').textContent='Modo demonstração local'}render()}
function nav(){const items=[['inicio','Início'],['bia','Bia'],['oportunidades','Oportunidades'],['central','Central IA'],['admin','Admin'],['pos','Pós-venda'],['ocorrencias','Ocorrências']];$('#nav').innerHTML=items.map(([v,l])=>`<button class="${state.view===v?'active':''}" onclick="setView('${v}')">${l}</button>`).join('')}
function render(){nav();const a=$('#app');if(state.view==='inicio')a.innerHTML=home();if(state.view==='bia')a.innerHTML=bia();if(state.view==='oportunidades')a.innerHTML=opps();if(state.view==='central')a.innerHTML=central();if(state.view==='admin')a.innerHTML=admin();if(state.view==='pos')a.innerHTML=pos();if(state.view==='ocorrencias')a.innerHTML=occ();bind()}
function heroCTA(){return `<div class="actions chips"><button class="btn primary" onclick="setView('bia')">Falar com a Bia</button><button class="btn secondary" onclick="setView('oportunidades')">Ver oportunidades</button></div>`}
function home(){return `<section class="hero"><div class="wrap heroGrid"><div class="heroCard"><div class="eyebrow">Inteligência imobiliária, marketing e vendas</div><h1>As melhores <span class="orange">oportunidades</span> de investimento imobiliário da região.</h1><p>Analisamos mercado, documentação, risco e oportunidade. A Bia transforma o que você quer em uma busca objetiva, comparável e negociável.</p>${heroCTA()}</div><div class="biaCard"><div class="biaTop"><div class="avatar"></div><div><h2>Oi, eu sou a Bia.</h2><p>Eu faço perguntas certas, encontro oportunidades e mostro o que faz sentido antes da visita.</p></div></div><div class="board"><h3>Comprar bem é decisão.</h3>${['Localização não é tudo: documentação sustenta preço.','Oportunidade só existe quando cabe no seu fluxo.','Campo ausente vira pergunta de negociação.'].map((x,i)=>`<div class="bullet"><div class="icon">${i+1}</div><div>${x}</div></div>`).join('')}</div><button class="btn primary block" onclick="setView('bia')">Começar diagnóstico</button></div></div></section><section class="section"><div class="wrap grid cols4">${['Análise completa|Localização, valorização, infraestrutura e potencial.','Dados e tendências|Leitura de mercado antes da negociação.','Segurança|Documentação verificada e transparência.','Negócio inteligente|Condição alinhada ao objetivo do comprador.'].map(x=>{const [h,p]=x.split('|');return `<div class="darkCard"><div class="icon">✓</div><h3>${h}</h3><p class="muted">${p}</p></div>`}).join('')}</div></section>`}
const qs=[['want','O que você busca?',['Terreno urbano','Casa','Apartamento','Área comercial']],['goal','Para quê?',['Morar','Investir','Construir','Comprar para família','Revender','Uso comercial']],['pain','O que mais falta na sua casa hoje? Escolha o que incomoda, não o que soa melhor.',['Espaço externo','Um cômodo a mais','Silêncio e privacidade','Segurança']],['extra','Se aparecessem 200 m² a mais, o que iam virar?',['Quintal e churrasqueira','Oficina ou garagem grande','Horta e árvores','Piscina e lazer']],['timeline','Em quanto tempo você quer sair de onde está? Não precisa ser realista, precisa ser sincero.',['Este ano','1 a 2 anos','3 a 5 anos','Não sei']],['reject','O que eliminaria uma opção automaticamente?',['Sem matrícula clara','Obra sem cronograma','Falta de licenciamento','Parcela acima do limite']]];
function bia(){const q=qs[state.q]||qs[0],criteria=mandate();return `<section class="section"><div class="wrap grid mainGrid"><div class="panel"><div class="panelHead"><div><span class="tag orangeTag">Bia</span><h2>Eu monto sua busca com você.</h2><p>Responda rápido. A plataforma transforma incômodo doméstico em mandato imobiliário.</p></div></div><div class="question"><h3>${q[1]}</h3><div class="options">${q[2].map(o=>`<button class="option ${state.bia[q[0]]===o?'active':''}" onclick="answer('${q[0]}','${o.replaceAll("'","\\'")}')">${o}</button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="prevQ()">Voltar</button><button class="btn primary" onclick="nextQ()">Continuar</button></div></div><hr style="border:0;border-top:1px solid #eadfce;margin:20px 0"><div class="formGrid"><div class="field c6"><label>Cidade/região</label><input id="biaCity" value="${state.bia.city}"></div><div class="field c6"><label>Teto de preço</label><input id="biaBudget" type="number" value="${state.bia.budget}"></div><div class="field c6"><label>Entrada disponível</label><input id="biaDown" type="number" value="${state.bia.down}"></div><div class="field c6"><label>Parcela ideal</label><input id="biaMonthly" type="number" value="${state.bia.monthly}"></div><div class="field c12"><label>Renda somada de quem participa da compra</label><input id="biaIncome" type="range" min="1800" max="30000" step="100" value="${state.bia.income}" oninput="document.getElementById('incomeOut').textContent=brl(this.value);state.bia.income=Number(this.value)"><b id="incomeOut">${brl(state.bia.income)}</b></div><div class="c12"><button class="btn primary block" onclick="runBia()">Gerar mandato e recomendar</button></div></div></div><div class="darkPanel"><div class="panelHead"><div><span class="tag teal">Mandato gerado</span><h2>Busca operacional</h2><p>A Bia gera critérios para recomendação e registro do lead.</p></div></div><div class="card"><p>${criteria.text}</p><div class="chips">${criteria.chips.map(c=>`<span class="tag teal">${c}</span>`).join('')}</div></div><div class="grid" style="margin-top:16px">${recommend(criteria).map(u=>oppCard(u,true)).join('')}</div></div></div></section>`}
function answer(k,v){state.bia[k]=v;render()}function nextQ(){state.q=Math.min(qs.length-1,state.q+1);saveBiaInputs();render()}function prevQ(){state.q=Math.max(0,state.q-1);saveBiaInputs();render()}function saveBiaInputs(){['City','Budget','Down','Monthly','Income'].forEach(x=>{const el=$('#bia'+x);if(el)state.bia[x.toLowerCase()]=x==='City'?el.value:Number(el.value)})}
function mandate(){const b=state.bia;let minArea=b.extra.includes('Piscina')?550:b.extra.includes('Horta')?500:b.extra.includes('Oficina')?480:420;let comfy=Math.round((b.income||0)*.28);return {text:`Buscar ${b.want.toLowerCase()} em ${b.city}, até ${brl(b.budget)}, com parcela ideal perto de ${brl(b.monthly)} e limite conservador de renda em ${brl(comfy)}. Priorizar ${b.priority}, ${b.pain.toLowerCase()} e uso futuro para ${b.extra.toLowerCase()}. Evitar opções com ${b.reject.toLowerCase()}.`,chips:[b.city,`até ${brl(b.budget)}`,`parcela ${brl(b.monthly)}`,b.goal,`mín. ${minArea} m²`,`prioridade: ${b.priority}`],minArea,comfy}}
function fit(u,c){let s=40;if(u.status==='disponível')s+=15;if(u.price<=c.budget)s+=20;else s-=20;if(u.monthly_payment<=c.monthly)s+=18;else s-=12;if(u.area_m2>=c.minArea)s+=15;if(JSON.stringify(u.verification||{}).includes('true'))s+=10;return Math.max(0,Math.min(100,Math.round(s)))}
function recommend(c){return [...state.data.units].filter(u=>u.status!=='vendido').map(u=>({...u,score:fit(u,c||mandate())})).sort((a,b)=>b.score-a.score).slice(0,3)}
async function runBia(){saveBiaInputs();const c=mandate();const score=Math.min(95,Math.max(20,Math.round((state.bia.income/30000)*35+(state.bia.down/state.bia.budget)*35+25)));const lead={name:'Lead Bia',phone:'',city:state.bia.city,source:'Bia',campaign:'Diagnóstico Bia',goal:state.bia.goal,profile:state.bia.goal.toLowerCase(),pain_point:state.bia.pain,extra_area_use:state.bia.extra,desired_move_timeline:state.bia.timeline,household_income:state.bia.income,max_budget:state.bia.budget,ideal_monthly_payment:state.bia.monthly,priority:state.bia.priority,objection:state.bia.reject,score,probability:Math.round(score*.78),status:'qualificado',next_action:'agendar conversa com Bia',transcript:[state.bia]};await save('fc_leads',lead,'Lead registrado na Central IA');await save('fc_bia_sessions',{mode:'entrevista',mandate:c.text,answers:state.bia,structured_criteria:c,recommendations:recommend(c)},'Mandato salvo');setView('oportunidades')}
function opps(){const c=mandate();return `<section class="section"><div class="wrap"><div class="panel"><div class="panelHead"><div><span class="tag teal">Oportunidades</span><h2>Resultados que fazem sentido para o comprador.</h2><p>O ranking não é anúncio: combina preço, parcela, objetivo e completude documental.</p></div></div><div class="grid cols3">${recommend(c).map(u=>oppCard(u)).join('')}</div></div></div></section>`}
function enterpriseName(id){return (state.data.enterprises.find(e=>e.id===id)||{}).name||'Empreendimento'}
function oppCard(u,compact=false){let gaps=['matricula','cronograma','licenciamento','garantia','historico','indexador'].filter(k=>!(u.verification||{})[k]);return `<div class="${compact?'darkCard':'card'}"><div class="chips"><span class="tag ${u.status==='disponível'?'green':'orangeTag'}">${u.status}</span><span class="tag teal">Score ${u.score||fit(u,mandate())}</span></div><h3>${u.label}</h3><p class="muted">${enterpriseName(u.enterprise_id)} · ${u.area_m2} m² · ${brl(u.price)}</p><div class="meter"><span style="width:${u.score||fit(u,mandate())}%"></span></div><p><b>Argumento:</b> ${u.sales_argument||'Análise em construção.'}</p><p><b>Objeção provável:</b> ${u.probable_objection||'não informada'}</p><div class="chips">${gaps.length?gaps.map(g=>`<span class="tag red">${g}</span>`).join(''):'<span class="tag green">documentos principais publicados</span>'}</div></div>`}
function central(){let k=state.data.leads.length,hot=state.data.leads.filter(l=>(l.score||0)>70).length;return `<section class="section"><div class="wrap grid"><div class="darkPanel"><div class="panelHead"><div><span class="tag orangeTag">Central Comercial Autônoma</span><h2>Todo lead deve receber argumento, produto, próximo passo e corretor certos.</h2><p>Modelo ativo de condução comercial com Bia SDR, handoff, follow-up e inteligência diária.</p></div></div><div class="grid cols4"><div class="darkCard"><span class="muted">Leads</span><div class="big">${k}</div></div><div class="darkCard"><span class="muted">Alta intenção</span><div class="big">${hot}</div></div><div class="darkCard"><span class="muted">Corretores</span><div class="big">${state.data.brokers.length}</div></div><div class="darkCard"><span class="muted">SDRs</span><div class="big">${state.data.sdrs.length}</div></div></div></div><div class="grid cols2"><div class="panel"><div class="panelHead"><h2>Prioridades do dia</h2></div><div class="priorityList">${['Responder leads de alta intenção','Agendar visitas pendentes','Recuperar propostas em risco','Reativar investidores antigos','Revisar campanha com baixa qualidade'].map(x=>`<div class="priority">${x}</div>`).join('')}</div></div><div class="panel"><div class="panelHead"><h2>Leads e handoff</h2></div>${table('leads')}</div></div></div></section>`}
function table(kind){if(kind==='leads')return `<div class="tableWrap"><table class="table"><thead><tr><th>Lead</th><th>Perfil</th><th>Score</th><th>Próxima ação</th></tr></thead><tbody>${state.data.leads.map(l=>`<tr><td>${l.name||'-'}<br><small>${l.phone||''}</small></td><td>${l.profile||l.goal||'-'}</td><td>${l.score||0}%</td><td>${l.next_action||'-'}</td></tr>`).join('')}</tbody></table></div>`}
function admin(){return `<section class="section"><div class="wrap grid"><div class="page-title"><span class="tag orangeTag">Admin</span><h1>Cadastro operacional da Futura Casa</h1><p>Empreendimentos, unidades, leads, corretores, SDRs, cronograma e ocorrências em Supabase.</p></div><div class="adminBar">${['Empreendimento','Unidade','Lead','Corretor','SDR','Cronograma','Ocorrência'].map(x=>`<button class="btn secondary small" onclick="showAdmin('${x}')">${x}</button>`).join('')}</div><div id="adminForm" class="panel">${adminForm('Empreendimento')}</div><div class="grid cols2"><div class="panel"><div class="panelHead"><h2>Empreendimentos</h2></div>${simpleList(state.data.enterprises,['name','city','region','delivery_year'])}</div><div class="panel"><div class="panelHead"><h2>Unidades</h2></div>${simpleList(state.data.units,['label','status','area_m2','price'])}</div></div></div></section>`}
function showAdmin(type){$('#adminForm').innerHTML=adminForm(type)}
function adminForm(type){if(type==='Empreendimento')return `<div class="panelHead"><h2>Cadastrar empreendimento</h2></div><div class="formGrid">${input('name','Nome','c6')}${input('city','Cidade','c3')}${input('region','Região','c3')}${input('positioning','Posicionamento','c6')}${input('delivery_year','Ano entrega','c3','number')}${input('evidence_level','Nível evidência','c3','number')}<div class="field c12"><label>Tese de investimento</label><textarea id="investment_thesis"></textarea></div><div class="c12"><button class="btn primary" onclick="saveEnterprise()">Salvar empreendimento</button></div></div>`;if(type==='Unidade')return `<div class="panelHead"><h2>Cadastrar unidade</h2></div><div class="formGrid"><div class="field c4"><label>Empreendimento</label><select id="enterprise_id">${state.data.enterprises.map(e=>`<option value="${e.id}">${e.name}</option>`)}</select></div>${input('label','Identificação','c4')}${input('unit_type','Tipo','c4')}${input('area_m2','Área m²','c3','number')}${input('price','Preço','c3','number')}${input('monthly_payment','Parcela','c3','number')}<div class="field c3"><label>Status</label><select id="status"><option>disponível</option><option>reservado</option><option>vendido</option></select></div>${input('ideal_profile','Perfil ideal','c4')}${input('sales_argument','Argumento','c4')}${input('probable_objection','Objeção provável','c4')}<div class="c12"><button class="btn primary" onclick="saveUnit()">Salvar unidade</button></div></div>`;if(type==='Lead')return `<div class="panelHead"><h2>Cadastrar lead</h2></div><div class="formGrid">${input('name','Nome','c4')}${input('phone','Telefone','c4')}${input('city','Cidade','c4')}${input('goal','Objetivo','c4')}${input('profile','Perfil','c4')}${input('max_budget','Teto','c4','number')}${input('ideal_monthly_payment','Parcela','c4','number')}${input('objection','Objeção','c8')}<div class="c12"><button class="btn primary" onclick="saveLead()">Salvar lead</button></div></div>`;if(type==='Corretor')return `<div class="panelHead"><h2>Cadastrar corretor</h2></div><div class="formGrid">${input('name','Nome','c4')}${input('phone','Telefone','c4')}${input('creci','CRECI','c4')}${input('specialty','Especialidade','c4')}${input('region','Região','c4')}${input('conversion_rate','Conversão','c4','number')}<div class="c12"><button class="btn primary" onclick="saveBroker()">Salvar corretor</button></div></div>`;if(type==='SDR')return `<div class="panelHead"><h2>Cadastrar SDR IA</h2></div><div class="formGrid">${input('name','Nome','c4')}${input('channel','Canal','c4')}${input('status','Status','c4')}<div class="field c12"><label>Política</label><textarea id="policy"></textarea></div><div class="c12"><button class="btn primary" onclick="saveSDR()">Salvar SDR</button></div></div>`;if(type==='Cronograma')return `<div class="panelHead"><h2>Cronograma da obra</h2></div><div class="formGrid">${input('track','Camada infra/casa','c3')}${input('phase','Etapa','c3')}${input('percent','%','c2','number')}${input('status','Status','c2')}${input('responsible','Responsável','c2')}<div class="field c12"><label>Notas</label><textarea id="notes"></textarea></div><div class="c12"><button class="btn primary" onclick="saveWork()">Salvar etapa</button></div></div>`;return `<div class="panelHead"><h2>Cadastrar ocorrência</h2></div><div class="formGrid">${input('category','Categoria','c4')}${input('priority','Prioridade','c4')}${input('responsible','Responsável','c4')}<div class="field c12"><label>Descrição</label><textarea id="description"></textarea></div><div class="c12"><button class="btn primary" onclick="saveOccurrence()">Salvar ocorrência</button></div></div>`}
function input(id,label,cls,type='text'){return `<div class="field ${cls}"><label>${label}</label><input id="${id}" type="${type}"></div>`}
function val(id){return $('#'+id)?.value||''}function num(id){return Number(val(id)||0)}
async function save(table,row,msg){try{await api.insert(table,row);toast(msg);await load()}catch(e){toast('Erro ao salvar: '+e.message)}}
function saveEnterprise(){save('fc_enterprises',{name:val('name'),city:val('city'),region:val('region'),positioning:val('positioning'),delivery_year:num('delivery_year'),evidence_level:num('evidence_level'),investment_thesis:val('investment_thesis')},'Empreendimento salvo')}
function saveUnit(){save('fc_units',{enterprise_id:val('enterprise_id'),label:val('label'),unit_type:val('unit_type'),area_m2:num('area_m2'),price:num('price'),monthly_payment:num('monthly_payment'),status:val('status'),ideal_profile:val('ideal_profile'),sales_argument:val('sales_argument'),probable_objection:val('probable_objection')},'Unidade salva')}
function saveLead(){save('fc_leads',{name:val('name'),phone:val('phone'),city:val('city'),goal:val('goal'),profile:val('profile'),max_budget:num('max_budget'),ideal_monthly_payment:num('ideal_monthly_payment'),objection:val('objection'),score:60,probability:45,status:'novo',next_action:'qualificar'},'Lead salvo')}
function saveBroker(){save('fc_brokers',{name:val('name'),phone:val('phone'),creci:val('creci'),specialty:val('specialty'),region:val('region'),conversion_rate:num('conversion_rate'),status:'ativo'},'Corretor salvo')}
function saveSDR(){save('fc_sdrs',{name:val('name'),channel:val('channel'),status:val('status'),policy:val('policy')},'SDR salvo')}
function saveWork(){save('fc_work_schedules',{track:val('track'),phase:val('phase'),percent:num('percent'),status:val('status'),responsible:val('responsible'),notes:val('notes')},'Cronograma salvo')}
function saveOccurrence(){save('fc_occurrences',{category:val('category'),priority:val('priority'),responsible:val('responsible'),description:val('description'),status:'aberta',source:'admin'},'Ocorrência salva')}
function simpleList(arr,keys){return `<div class="tableWrap"><table class="table"><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${arr.map(r=>`<tr>${keys.map(k=>`<td>${k.includes('price')?brl(r[k]):(r[k]??'-')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function pos(){let infra=state.data.works.filter(w=>w.track==='infra'),casa=state.data.works.filter(w=>w.track==='casa');return `<section class="section"><div class="wrap"><div class="panel"><div class="panelHead"><div><span class="tag teal">Pós-venda</span><h2>Minha Obra</h2><p>O cronograma cadastrado na gestão aparece aqui.</p></div></div><div class="tabs"><button class="tab active">Obras do loteamento</button><button class="tab">Obras da casa</button></div><div class="timeline">${[...infra,...casa].map(w=>`<div class="phase ${w.status==='concluído'?'done':w.status==='em andamento'?'active':''}"><div class="circle">${Math.round(w.percent||0)}%</div><h3>${w.phase}</h3><p>${w.status}</p><small>${w.responsible||''}</small></div>`).join('')}</div></div></div></section>`}
function occ(){return `<section class="section"><div class="wrap grid cols2"><div class="panel"><div class="panelHead"><div><span class="tag orangeTag">Ocorrências</span><h2>Registrar ocorrência</h2><p>Use geolocalização real quando disponível.</p></div></div><div class="formGrid">${input('category','Categoria','c6')}${input('priority','Prioridade','c6')}<div class="field c12"><label>Descrição</label><textarea id="description"></textarea></div><div class="c12 actions chips"><button class="btn secondary" onclick="geoOcc()">Usar minha localização</button><button class="btn primary" onclick="saveOccurrence()">Registrar</button></div></div></div><div class="panel"><div class="panelHead"><h2>Ocorrências abertas</h2></div>${simpleList(state.data.occurrences,['category','priority','status','responsible'])}</div></div></section>`}
function geoOcc(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>toast('Localização capturada: '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)),()=>toast('GPS não autorizado')):toast('GPS indisponível')}
function bind(){}
document.getElementById('menuBtn').onclick=()=>document.getElementById('nav').classList.toggle('open');window.onhashchange=()=>{state.view=location.hash.replace('#','')||'inicio';render()};load();
</script>
</body></html>
